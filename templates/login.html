<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — DRE Gestores MQ Hair</title>
  <meta name="description" content="Acesso corporativo ao Demonstrativo de Resultado do Exercício para Gestores e Diretoria MQ Hair." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #CB9727;
      --gold-light: #e0b84a;
      --gold-dark: #9e7416;
      --gold-subtle: rgba(203, 151, 39, 0.12);
      --black: #121212;
      --black2: #181818;
      --surface: #1e1e1e;
      --surface2: #252525;
      --surface3: #2c2c2c;
      --border: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(203, 151, 39, 0.35);
      --text-primary: #f5f5f5;
      --text-secondary: #a0a0a0;
      --text-muted: #777777;
      --danger: #ff4757;
      --danger-bg: rgba(255, 71, 87, 0.12);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.2s ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--black);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(203, 151, 39, 0.08) 0%, transparent 55%),
        radial-gradient(circle at 80% 85%, rgba(203, 151, 39, 0.04) 0%, transparent 45%);
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 36px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .logo-mq {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fdfbd4 0%, #cb9727 60%, #9e7416 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sep {
      color: var(--border);
      font-weight: 300;
      font-size: 18px;
    }

    .logo-txt {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .badge-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-subtle);
      border: 1px solid var(--border-gold);
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 4px;
    }

    .login-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
      transition: var(--transition);
    }

    .form-input {
      width: 100%;
      height: 46px;
      background: var(--black2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 14px 0 42px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
    }

    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(203, 151, 39, 0.15);
    }

    .form-input:focus + .input-icon {
      color: var(--gold);
    }

    .toggle-pwd {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 4px;
      transition: var(--transition);
    }

    .toggle-pwd:hover {
      color: var(--text-primary);
    }

    .error-alert {
      display: none;
      background: var(--danger-bg);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: #ff6b81;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.25s ease;
    }

    .error-alert.show {
      display: flex;
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #d4a539 0%, #cb9727 60%, #a67b1d 100%);
      color: #121212;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(203, 151, 39, 0.25);
      margin-top: 8px;
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #e0b84a 0%, #d4a539 60%, #b88a24 100%);
      box-shadow: 0 6px 20px rgba(203, 151, 39, 0.4);
      transform: translateY(-1px);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(18, 18, 18, 0.3);
      border-top-color: #121212;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .login-footer strong {
      color: var(--gold);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-box">
        <span class="logo-mq">MQ</span>
        <span class="logo-sep">|</span>
        <span class="logo-txt">DRE Gestores</span>
      </div>
      <div>
        <span class="badge-tag">Portal Executivo</span>
      </div>
      <p class="login-subtitle">Entre com suas credenciais corporativas</p>
    </div>

    <div class="error-alert" id="errorAlert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="errorMessage">Credenciais inválidas.</span>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="username">Usuário</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-input" 
            placeholder="Ex: ricardo.pavao ou diretoria" 
            required 
            autofocus 
          />
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="Digite sua senha" 
            required 
          />
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <button type="button" class="toggle-pwd" id="togglePwd" title="Exibir/Ocultar senha">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span class="spinner" id="btnSpinner"></span>
        <span id="btnText">Acessar DRE</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </form>

    <div class="login-footer">
      Desenvolvido por <strong>BI MQ Hair Company</strong>
    </div>
  </div>
</div>

<script>
  const loginForm = document.getElementById('loginForm');
  const btnSubmit = document.getElementById('btnSubmit');
  const btnSpinner = document.getElementById('btnSpinner');
  const btnText = document.getElementById('btnText');
  const errorAlert = document.getElementById('errorAlert');
  const errorMessage = document.getElementById('errorMessage');
  const togglePwd = document.getElementById('togglePwd');
  const passwordInput = document.getElementById('password');

  // Toggle senha
  togglePwd.addEventListener('click', () => {
    const isPassword = passwordInput.getAttribute('type') === 'password';
    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
    togglePwd.style.color = isPassword ? 'var(--gold)' : 'var(--text-muted)';
  });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorAlert.classList.remove('show');
    btnSubmit.disabled = true;
    btnSpinner.style.display = 'inline-block';
    btnText.textContent = 'Verificando...';

    const username = document.getElementById('username').value.trim();
    const password = passwordInput.value;

    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await response.json();

      if (response.ok && data.status === 'ok') {
        window.location.href = '/';
      } else {
        errorMessage.textContent = data.error || 'Credenciais inválidas. Tente novamente.';
        errorAlert.classList.add('show');
        btnSubmit.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Acessar DRE';
      }
    } catch (err) {
      errorMessage.textContent = 'Erro ao conectar com o servidor. Tente novamente.';
      errorAlert.classList.add('show');
      btnSubmit.disabled = false;
      btnSpinner.style.display = 'none';
      btnText.textContent = 'Acessar DRE';
    }
  });
</script>

</body>
</html>
